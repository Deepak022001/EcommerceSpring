spring.application.name=EcommerceSpring
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=YourNewPassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#Speak SQL in the MySQL 8 accent
spring.jpa.hibernate.ddl-auto=update
#It tells Hibernate how to handle the database
# schema (tables, columns, etc.) every time your app starts.
#spring.jpa.hibernate.ddl-auto ? The setting that controls schema generation.
#
#update ? The mode that tells Hibernate to automatically update
# the database schema to match your entities (Java classes).
server.port=9000
spring.devtools.restart.enabled=false
